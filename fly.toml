# fly.toml app configuration file generated for better-spotify on 2024-12-23T14:50:10-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'better-spotify'
primary_region = 'den'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Playlist builds continue after the browser disconnects, so the web Machine
  # must not be stopped while a background build is still running.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthcheck'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
